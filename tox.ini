# Test environments, one per Python version this package declares support for.
# The list mirrors requires-python in pyproject.toml -- testing a version that
# is not promised, or promising one that is not tested, are both ways of saying
# something untrue about the package.
[tox]
env_list = py313, py314
isolated_build = true

[testenv]
runner = uv-venv-runner
extras = dev
commands = pytest {posargs}
