[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.image_service"
version = "0.1.0"
description = "Stores, reviews and delivers the photograph of a person for eduTAP"
readme = "README.md"
requires-python = ">=3.13"
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
dependencies = [
    "aioboto3>=13",
    "asyncpg>=0.29",
    # PEP 508 direct references: public but not published to a public index, pinned
    # to an immutable ref rather than to a branch. The two photo tables this service
    # writes are declared in db_definitions and imported at runtime; data_models is
    # named even though db_definitions pulls it in, because a dependency one relies
    # on but does not declare disappears the moment the package in between drops it.
    "edutap.data_models @ git+https://github.com/edutap-collective/edutap.data_models@v0.2.0",
    # A commit rather than a tag, which is the exception here and should not last:
    # `public.photo` and `public.photo_review` landed on main after v0.1.3, and no
    # release has been cut since. Pinning the branch would let the schema this
    # service writes change under it without a version to point at. Replace this
    # with the tag as soon as db_definitions cuts one.
    "edutap.db_definitions @ git+https://github.com/edutap-collective/edutap.db_definitions@d26786e8",
    "fastapi>=0.115",
    # The client for edutap.image_api. httpx2 rather than httpx: starlette 1.3
    # prefers it and warns whenever it has to fall back, and it is the house
    # standard for REST clients across these packages.
    "httpx2>=2.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # [asyncio] rather than bare sqlalchemy: the async engine needs greenlet, and
    # SQLAlchemy leaves it to that extra rather than to the core requirement.
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pdbp",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    # Pinned below 0.17 for the same reason as the sibling packages: a minor bump
    # has changed formatting output before, which turns `format --check` red in a
    # pull request that touched nothing.
    "ruff>=0.16,<0.17",
    "testcontainers[postgres]>=4.8",
    "ty",
]
docs = ["myst-parser", "sphinx>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.hatch.metadata]
# Required by hatchling for the direct references (git URLs, not PyPI names) above.
# This package is never published to PyPI, so the restriction those normally exist
# to enforce there does not apply.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a PostgreSQL container; excluded from the default run",
]
# The default run is the one a developer gets from `make test-local`, and it has to
# stay fast enough to run on every save. The integration job in CI adds the marker
# back explicitly.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "S", "UP", "W"]
ignore = [
    # A one-line summary is required (D103 and friends stay on); the blank line
    # before it is a convention this project does not follow.
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names and their docstrings where the
# reasoning is not obvious. `assert` is the point of a test, not a security finding.
"tests/*" = ["D100", "D103", "S101"]
