[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.image_service"
version = "0.1.0"
description = "Stores, reviews and delivers the photograph of a person for eduTAP"
readme = "README.md"
requires-python = ">=3.13"
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
dependencies = [
    "aioboto3>=13",
    "asyncpg>=0.29",
    # PEP 508 direct references: public but not published to a public index, pinned
    # to an immutable ref rather than to a branch. The two photo tables this service
    # writes are declared in db_definitions and imported at runtime; data_models is
    # named even though db_definitions pulls it in, because a dependency one relies
    # on but does not declare disappears the moment the package in between drops it.
    # v0.2.2 rather than v0.2.0: db_definitions v0.2.1 requires >=0.2.1,<0.3, and a
    # direct reference is an exact pin, not a range -- so the two have to be moved
    # together or the resolver has nothing to choose.
    "edutap.data_models @ git+https://github.com/edutap-collective/edutap.data_models@v0.2.2",
    # Back on a tag: v0.2.1 is the release that carries the `draft` state of
    # `public.photo`, the partial unique index that keeps it to one per person, the
    # `draft_details` column and `rights_declared_at` turning nullable. The commit
    # pin that stood here was the stated exception until a release existed.
    "edutap.db_definitions @ git+https://github.com/edutap-collective/edutap.db_definitions@v0.2.1",
    "fastapi>=0.115",
    # The client for edutap.image_api. httpx2 rather than httpx: starlette 1.3
    # prefers it and warns whenever it has to fall back, and it is the house
    # standard for REST clients across these packages.
    "httpx2>=2.9",
    # Decoding and re-encoding on the way in is what strips camera metadata, and
    # the pixel-count guard is what stops a decompression bomb before a decoder
    # allocates for it. edutap.image_api analyses and transforms; it does not
    # sanitise, and it never sees a file that has not passed through here.
    "pillow>=11",
    "pydantic>=2.8",
    # An upload arrives as multipart/form-data, and FastAPI raises at *import* time
    # without this -- not on the first request. A deployment that forgot it would
    # fail to start rather than fail a upload, which is the better of the two but
    # only if the requirement is declared.
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.4",
    # [asyncio] rather than bare sqlalchemy: the async engine needs greenlet, and
    # SQLAlchemy leaves it to that extra rather than to the core requirement.
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pdbp",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    # Pinned below 0.17 for the same reason as the sibling packages: a minor bump
    # has changed formatting output before, which turns `format --check` red in a
    # pull request that touched nothing.
    "ruff>=0.16,<0.17",
    "testcontainers[postgres]>=4.8",
    "ty",
]
docs = ["myst-parser", "sphinx>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]
# The placeholder is served by the one unauthenticated route, so a wheel without it
# answers 500 for every person who has not uploaded anything -- which is all of them
# on day one.
artifacts = ["src/edutap/image_service/assets/*.png"]

[tool.hatch.metadata]
# Required by hatchling for the direct references (git URLs, not PyPI names) above.
# This package is never published to PyPI, so the restriction those normally exist
# to enforce there does not apply.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a PostgreSQL container; excluded from the default run",
]
# The default run is the one a developer gets from `make test-local`, and it has to
# stay fast enough to run on every save. The integration job in CI adds the marker
# back explicitly.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "S", "UP", "W"]
ignore = [
    # A one-line summary is required (D103 and friends stay on); the blank line
    # before it is a convention this project does not follow.
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names and their docstrings where the
# reasoning is not obvious. `assert` is the point of a test, not a security finding.
# The class rules go with the function ones: a test double is named for what it
# fakes, and requiring prose on `FakeStore.__init__` produces noise rather than
# explanation.
"tests/*" = ["D100", "D101", "D102", "D103", "D107", "S101"]
